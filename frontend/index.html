<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>ProofChain</title>
    <script>
      // Blocking on purpose: applies the theme before first paint, so a stored dark choice
      // does not flash light while the bundle loads. Keep in step with src/lib/theme.ts.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("proofchain.theme");
        } catch (e) {}
        if (t !== "dark" && t !== "light") t = "dark"; // default, not the OS setting
        document.documentElement.classList.toggle("dark", t === "dark");
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
