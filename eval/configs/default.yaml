# Corpus configuration (docs/08_TESTING_AND_EVAL.md C.1). Every value that shapes the corpus is here.
seed: 20260930
n_docs: 200
corpus_dir: data/corpus

# Doc types are assigned round-robin by document index (index % len), so shares are exactly
# balanced for any n_docs (each type's share differs from 1/len by at most 1 document).
doc_types: [lease, service_agreement, nda, invoice, certificate]

# Upper page bound per type. A drawn page count is clamped into [1, cap] for the type
# (an invoice or certificate cannot sensibly be 40 pages long).
type_max_pages: {lease: 50, service_agreement: 50, nda: 50, invoice: 6, certificate: 2}

# Named page-count function (registry in page_counts.py). "bucketed_skewed": pick a bucket by
# weight, then draw the page count uniformly inside the bucket. The bucket is chosen by a
# low-discrepancy sequence over the document index (stratified, not random), so realised bucket
# shares track the weights closely for any n_docs. Weights are relative.
page_count:
  function: bucketed_skewed
  params:
    buckets:
      - {name: short, min: 1, max: 3, weight: 35}
      - {name: medium, min: 4, max: 12, weight: 27}
      - {name: long, min: 13, max: 50, weight: 38}

# Tamper cases (docs/08 C.2). `cases` = number of SUCCESSFUL cases wanted per (op, mode); an
# in-place attempt that does not fit its block is recorded as skipped and another document is tried.
# Modes: rerender = edit the spec and re-render; inplace = PyMuPDF redact+insert on the original PDF;
# resave = metadata-only re-save. Cases are drawn from a per-(op, mode, attempt) seed, not from a
# shared generator, so each case is reproducible on its own.
tamper:
  seed: 20260930
  out_dir: data/tamper
  multi_edit_ops: {min: 2, max: 5}
  # Candidate replacement names tried per in-place party attempt (1 = a single draw, no retries).
  inplace_party_candidates: 1
  cases:
    amount_change: {rerender: 20, inplace: 20}
    date_change: {rerender: 20, inplace: 20}
    party_change: {rerender: 20, inplace: 20}
    percentage_change: {rerender: 20}
    number_change: {rerender: 20}
    obligation_flip: {rerender: 20}
    clause_insert: {rerender: 20}
    clause_delete: {rerender: 20}
    clause_reword: {rerender: 20}
    typo_fix: {rerender: 20}
    metadata_only: {resave: 20}
    multi_edit: {rerender: 40}

# Evaluation runner (docs/08 C.3), run_eval.py. Results go to eval/results/<run-name> (gitignored).
eval:
  out_dir: results
  # Latency vs page count on synthetic lease documents (median of `repeats` runs).
  latency:
    pages: [1, 5, 10, 25, 50, 100]
    repeats: 5

# Chain metrics (docs/08 C.3, Chain), measure_chain.py. The ONLY part of the eval that spends gas.
# Plan = `latency_samples` first versions (one per document) + `subsequent_versions` second versions
# = 15 transactions. `max_transactions` is a hard cap: a plan above it is refused before the first
# send, there is no retry, and the cap is re-checked against the sender's on-chain nonce afterwards.
chain:
  seed: 20260930
  latency_samples: 10
  subsequent_versions: 5
  max_transactions: 20
  min_balance_eth: 0.005  # refuse to start below this balance
  confirmations: {local: 1, sepolia: 2}
  measurements_dir: measurements  # committed: live Sepolia numbers cannot be regenerated
  # FALLBACK ONLY: used when a live price lookup fails (prices.py). Illustrative, not current; the
  # report says so when any field comes from here.
  prices: {gas_price_gwei: 20.0, eth_usd: 3000.0, eth_inr: 250000.0}
