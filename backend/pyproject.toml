[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofchain"
version = "0.1.0"
description = "Blockchain-anchored document provenance and tamper localization"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "motor>=3.4",
    "boto3>=1.34",
    "web3>=6.15",
    "pymupdf==1.28.2",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "moto[s3]>=5.0",
    "mongomock-motor>=0.0.29",
    "reportlab==5.0.1",
    "ruff>=0.4",
    "mypy>=1.10",
]
nlp = [
    "spacy>=3.7",
    "sentence-transformers>=2.7",
    "dateparser>=1.2",
]

[tool.setuptools.packages.find]
include = ["app*", "proofchain_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not nlp and not chain and not slow"'
markers = [
    "nlp: needs NLP models installed",
    "chain: needs a running Hardhat node and deployed contract",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "proofchain_core.*"
strict = true
