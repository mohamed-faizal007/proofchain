name: proofchain
services:
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  minio:
    # MinIO no longer publishes to Docker Hub; images live on quay.io.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/proofchain-docs;
      mc version enable local/proofchain-docs;
      exit 0;"

  # Local chain. Alternatively run `npx hardhat node` from contracts/.
  hardhat:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx hardhat node --hostname 0.0.0.0"
    volumes: [../contracts:/app]
    ports: ["127.0.0.1:8545:8545"]
    profiles: ["chain"]   # enable with: docker compose -f infra/docker-compose.yml --profile chain up -d

  # ---- Full app: docker compose -f infra/docker-compose.yml --profile app up -d --build ----
  # Browser -> backend directly on 127.0.0.1:8000 (no reverse proxy), so per-IP rate limits
  # (ADR-022) see the TCP peer. Set JWT_SECRET (and SEED_PASSWORD, APP_ENV=prod) in the shell
  # or a root .env.
  backend:
    profiles: ["app"]
    build:
      context: ../backend
      args:
        WITH_NLP: ${WITH_NLP:-1}
      additional_contexts:
        pins: ../eval
    environment:
      APP_ENV: ${APP_ENV:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      MONGO_URI: mongodb://mongo:27017
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: proofchain-docs
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-http://hardhat:8545}
      CHAIN_ID: ${CHAIN_ID:-31337}
      REGISTRY_ADDRESS: ${REGISTRY_ADDRESS:-}
      ANCHOR_PRIVATE_KEY: ${ANCHOR_PRIVATE_KEY:-}
      CHAIN_CONFIRMATIONS: ${CHAIN_CONFIRMATIONS:-1}
      EXPLORER_TX_URL: ${EXPLORER_TX_URL:-}
      HF_HUB_OFFLINE: "1"
    depends_on:
      mongo: {condition: service_healthy}
      minio: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    # /health is HTTP 200 even when degraded; the script exits 1 unless the body says "ok".
    healthcheck:
      test: ["CMD", "python", "-m", "app.scripts.healthcheck"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 3

  frontend:
    profiles: ["app"]
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_EXPLORER_TX_URL: ${VITE_EXPLORER_TX_URL:-}
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]

volumes:
  mongo-data:
  minio-data:
